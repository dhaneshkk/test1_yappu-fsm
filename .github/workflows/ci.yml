name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                     # one job failing must not cancel the others
      matrix:
        python: ["3.10", "3.11", "3.13"]   # ubuntu-latest (26.04) no longer ships Python 3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,asp]"
      - run: pytest -q   # HF tests are skipped without torch; ASP equivalence tests need clingo
  hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[hf,dev]"
      - run: pytest -q
      - run: yappu demo-decode
